name: OpenNext migration

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.number == 35
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Use Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Replace the archived Pages toolchain
        shell: bash
        run: |
          set -euo pipefail

          npm uninstall \
            @cloudflare/next-on-pages \
            @vercel/fun \
            @vercel/node \
            @vercel/redwood \
            @vercel/routing-utils \
            @vercel/static-build \
            editorconfig-tools \
            hint \
            vercel

          npm install --save-exact \
            next@15.5.22 \
            react@19.2.8 \
            react-dom@19.2.8

          npm install --save-dev --save-exact \
            @opennextjs/cloudflare@1.20.2 \
            wrangler@4.114.0 \
            eslint-config-next@15.5.22

          npm install --save-dev \
            @types/node@22 \
            @types/react@19 \
            @types/react-dom@19

      - name: Configure OpenNext Workers
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          import fs from 'node:fs';

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts.preview = 'opennextjs-cloudflare build && opennextjs-cloudflare preview';
          pkg.scripts.deploy = 'opennextjs-cloudflare build && opennextjs-cloudflare deploy';
          pkg.scripts.upload = 'opennextjs-cloudflare build && opennextjs-cloudflare upload';
          pkg.scripts['cf-typegen'] = 'wrangler types --env-interface CloudflareEnv cloudflare-env.d.ts';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const nextConfigPath = 'next.config.mjs';
          let nextConfig = fs.readFileSync(nextConfigPath, 'utf8');
          if (!nextConfig.includes('initOpenNextCloudflareForDev')) {
            nextConfig += '\nimport { initOpenNextCloudflareForDev } from "@opennextjs/cloudflare";\n\ninitOpenNextCloudflareForDev();\n';
            fs.writeFileSync(nextConfigPath, nextConfig);
          }

          const gitignorePath = '.gitignore';
          let gitignore = fs.readFileSync(gitignorePath, 'utf8');
          for (const entry of ['/.open-next/', '.dev.vars', 'cloudflare-env.d.ts']) {
            if (!gitignore.split(/\r?\n/).includes(entry)) {
              gitignore += `${gitignore.endsWith('\n') ? '' : '\n'}${entry}\n`;
            }
          }
          fs.writeFileSync(gitignorePath, gitignore);

          const headersPath = 'public/_headers';
          let headers = fs.readFileSync(headersPath, 'utf8');
          if (!headers.includes('/_next/static/*')) {
            headers += `${headers.endsWith('\n') ? '' : '\n'}\n# -- OPENNEXT IMMUTABLE BUILD ASSETS --\n/_next/static/*\n  Cache-Control: public,max-age=31536000,immutable\n`;
            fs.writeFileSync(headersPath, headers);
          }
          NODE

          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "yourselftoscience-web",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-08-04",
            "compatibility_flags": [
              "nodejs_compat",
              "global_fetch_strictly_public"
            ],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "observability": {
              "enabled": true
            }
          }
          EOF

          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          import staticAssetsIncrementalCache from "@opennextjs/cloudflare/overrides/incremental-cache/static-assets-incremental-cache";

          export default defineCloudflareConfig({
            incrementalCache: staticAssetsIncrementalCache,
            enableCacheInterception: true,
          });
          EOF

          cat > .dev.vars.example <<'EOF'
          NEXTJS_ENV="development"
          RESEND_API_KEY="replace-with-local-secret"
          MAILCHIMP_API_KEY="replace-with-local-secret"
          MAILCHIMP_AUDIENCE_ID="replace-with-local-secret"
          MAILCHIMP_SERVER_PREFIX="replace-with-local-secret"
          EOF

      - name: Remove unsupported Edge Runtime declarations
        shell: bash
        run: |
          set -euo pipefail
          grep -RIlE --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            'export const runtime[[:space:]]*=[[:space:]]*["'"']edge["'"']' src \
            > /tmp/edge-runtime-files.txt || true

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            sed -i -E '/export const runtime[[:space:]]*=[[:space:]]*["'"']edge["'"'];?/d' "$file"
          done < /tmp/edge-runtime-files.txt

          if grep -RInE --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            'export const runtime[[:space:]]*=[[:space:]]*["'"']edge["'"']' src; then
            echo 'Unsupported Edge Runtime declarations remain.' >&2
            exit 1
          fi

      - name: Run tests and validate generated agent contracts
        run: |
          npm test
          npm run update-openapi
          npm run extend-openapi
          npm run validate-agent-artifacts

      - name: Build OpenNext Worker
        env:
          NEXTJS_ENV: production
        run: npx opennextjs-cloudflare build

      - name: Validate Worker bundle and Free-plan size
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Enforce runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit validated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            next.config.mjs \
            wrangler.jsonc \
            open-next.config.ts \
            .gitignore \
            .dev.vars.example \
            public/_headers

          while IFS= read -r file; do
            [ -n "$file" ] && git add "$file"
          done < /tmp/edge-runtime-files.txt

          git diff --cached --check
          git commit -m "Migrate deployment to OpenNext Workers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
