name: Agent API security

on:
  pull_request:
    paths:
      - 'next.config.mjs'
      - 'wrangler.jsonc'
      - 'open-next.config.ts'
      - 'src/middleware.js'
      - 'src/lib/agentApi.js'
      - 'src/app/api/**'
      - 'src/app/umami/**'
      - 'scripts/extendAgentOpenApi.js'
      - 'scripts/validateAgentArtifacts.js'
      - 'scripts/enforceRuntimeAudit.js'
      - 'public/.well-known/agent-card.json'
      - 'public/openapi.json'
      - 'public/_headers'
      - 'test/agentApi.test.js'
      - 'test/platformSecurity.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-api-security.yml'
  push:
    branches: [main]
    paths:
      - 'next.config.mjs'
      - 'wrangler.jsonc'
      - 'open-next.config.ts'
      - 'src/middleware.js'
      - 'src/lib/agentApi.js'
      - 'src/app/api/**'
      - 'src/app/umami/**'
      - 'scripts/extendAgentOpenApi.js'
      - 'scripts/validateAgentArtifacts.js'
      - 'scripts/enforceRuntimeAudit.js'
      - 'public/.well-known/agent-card.json'
      - 'public/openapi.json'
      - 'public/_headers'
      - 'test/agentApi.test.js'
      - 'test/platformSecurity.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-api-security.yml'

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check next.config.mjs
          node --check src/middleware.js
          node --check src/lib/agentApi.js
          node --check src/app/api/resources/route.js
          node --check 'src/app/api/resources/[id]/route.js'
          node --check src/app/api/facets/route.js
          node --check src/app/api/health/route.js
          node --check 'src/app/umami/script.js/route.js'
          node --check src/app/umami/api/send/route.js
          node --check scripts/extendAgentOpenApi.js
          node --check scripts/validateAgentArtifacts.js
          node --check scripts/enforceRuntimeAudit.js
          node --check test/platformSecurity.test.js

      - name: Run security regression tests
        run: npm test

      - name: Regenerate and validate agent contracts
        run: |
          npm run update-openapi
          npm run extend-openapi
          npm run validate-agent-artifacts

      - name: Generate dependency audit reports
        run: |
          npm audit --omit=dev --json --package-lock-only > npm-audit-runtime.json || true
          npm audit --json --package-lock-only > npm-audit-full.json || true

      - name: Upload dependency audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audits
          path: |
            npm-audit-runtime.json
            npm-audit-full.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce runtime dependency audit
        run: node scripts/enforceRuntimeAudit.js npm-audit-runtime.json npm-audit-full.json

  migrate-open-next:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Determine whether migration is required
        id: migration-state
        shell: bash
        run: |
          if grep -q '"@cloudflare/next-on-pages"' package.json; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'OpenNext migration is already present.'
          fi

      - name: Report migration start
        if: steps.migration-state.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 35 --body "OpenNext migration validation started for commit \`${GITHUB_SHA::7}\`. The branch will only be updated if tests, build, bundle validation, and the runtime audit pass."

      - name: Use Node.js 22.23.1
        if: steps.migration-state.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Upgrade framework and replace Pages adapter
        if: steps.migration-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          npm uninstall \
            @cloudflare/next-on-pages \
            @vercel/fun \
            @vercel/node \
            @vercel/redwood \
            @vercel/routing-utils \
            @vercel/static-build \
            editorconfig-tools \
            hint \
            vercel

          npm install --save-exact \
            next@15.5.22 \
            react@19.2.8 \
            react-dom@19.2.8

          npm install --save-dev --save-exact \
            @opennextjs/cloudflare@1.20.2 \
            wrangler@4.114.0 \
            eslint-config-next@15.5.22 \
            @types/react@latest \
            @types/react-dom@latest

      - name: Configure OpenNext Workers
        if: steps.migration-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          import fs from 'node:fs';

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts.preview = 'opennextjs-cloudflare build && opennextjs-cloudflare preview';
          pkg.scripts.deploy = 'opennextjs-cloudflare build && opennextjs-cloudflare deploy';
          pkg.scripts.upload = 'opennextjs-cloudflare build && opennextjs-cloudflare upload';
          pkg.scripts['cf-typegen'] = 'wrangler types --env-interface CloudflareEnv cloudflare-env.d.ts';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const nextConfigPath = 'next.config.mjs';
          let nextConfig = fs.readFileSync(nextConfigPath, 'utf8');
          if (!nextConfig.includes('initOpenNextCloudflareForDev')) {
            nextConfig += '\nimport { initOpenNextCloudflareForDev } from "@opennextjs/cloudflare";\n\ninitOpenNextCloudflareForDev();\n';
            fs.writeFileSync(nextConfigPath, nextConfig);
          }

          const gitignorePath = '.gitignore';
          let gitignore = fs.readFileSync(gitignorePath, 'utf8');
          for (const entry of ['/.open-next/', '.dev.vars', 'cloudflare-env.d.ts']) {
            if (!gitignore.split(/\r?\n/).includes(entry)) {
              gitignore += `${gitignore.endsWith('\n') ? '' : '\n'}${entry}\n`;
            }
          }
          fs.writeFileSync(gitignorePath, gitignore);

          const headersPath = 'public/_headers';
          let headers = fs.readFileSync(headersPath, 'utf8');
          if (!headers.includes('/_next/static/*')) {
            headers += `${headers.endsWith('\n') ? '' : '\n'}\n# -- OPENNEXT IMMUTABLE BUILD ASSETS --\n/_next/static/*\n  Cache-Control: public,max-age=31536000,immutable\n`;
            fs.writeFileSync(headersPath, headers);
          }
          NODE

          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "yourselftoscience-web",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-08-04",
            "compatibility_flags": [
              "nodejs_compat",
              "global_fetch_strictly_public"
            ],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "observability": {
              "enabled": true
            }
          }
          EOF

          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";
          import staticAssetsIncrementalCache from "@opennextjs/cloudflare/overrides/incremental-cache/static-assets-incremental-cache";

          export default defineCloudflareConfig({
            incrementalCache: staticAssetsIncrementalCache,
            enableCacheInterception: true,
          });
          EOF

          cat > .dev.vars.example <<'EOF'
          NEXTJS_ENV="development"
          RESEND_API_KEY="replace-with-local-secret"
          MAILCHIMP_API_KEY="replace-with-local-secret"
          MAILCHIMP_AUDIENCE_ID="replace-with-local-secret"
          MAILCHIMP_SERVER_PREFIX="replace-with-local-secret"
          EOF

      - name: Remove unsupported Edge Runtime declarations
        if: steps.migration-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -RIlE --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            'export const runtime[[:space:]]*=[[:space:]]*["'"']edge["'"']' src \
            > /tmp/edge-runtime-files.txt || true

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            sed -i -E '/export const runtime[[:space:]]*=[[:space:]]*["'"']edge["'"'];?/d' "$file"
          done < /tmp/edge-runtime-files.txt

          if grep -RInE --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            'export const runtime[[:space:]]*=[[:space:]]*["'"']edge["'"']' src; then
            echo 'Unsupported Edge Runtime declarations remain.' >&2
            exit 1
          fi

      - name: Validate source and generated contracts
        if: steps.migration-state.outputs.needed == 'true'
        run: |
          npm test
          npm run update-openapi
          npm run extend-openapi
          npm run validate-agent-artifacts

      - name: Build OpenNext Worker
        if: steps.migration-state.outputs.needed == 'true'
        env:
          NEXTJS_ENV: production
        run: npx opennextjs-cloudflare build

      - name: Validate Worker bundle and Free-plan size
        if: steps.migration-state.outputs.needed == 'true'
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Enforce runtime dependency audit
        if: steps.migration-state.outputs.needed == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Record full dependency audit without blocking migration
        if: steps.migration-state.outputs.needed == 'true'
        run: npm audit --json > npm-audit-full.json || true

      - name: Commit validated migration
        if: steps.migration-state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            next.config.mjs \
            wrangler.jsonc \
            open-next.config.ts \
            .gitignore \
            .dev.vars.example \
            public/_headers

          while IFS= read -r file; do
            [ -n "$file" ] && git add "$file"
          done < /tmp/edge-runtime-files.txt

          git diff --cached --check
          git commit -m "Migrate deployment to OpenNext Workers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Report migration success
        if: steps.migration-state.outputs.needed == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 35 --body "OpenNext migration validation passed and the validated migration commit was pushed. GitHub security checks will now run against the migrated branch."

      - name: Report migration failure
        if: steps.migration-state.outputs.needed == 'true' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 35 --body "OpenNext migration validation failed. Run details: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No unvalidated migration changes were pushed."
