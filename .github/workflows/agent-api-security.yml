name: Agent API security

on:
  pull_request:
    paths:
      - 'src/lib/agentApi.js'
      - 'src/app/api/**'
      - 'scripts/extendAgentOpenApi.js'
      - 'scripts/validateAgentArtifacts.js'
      - 'public/.well-known/agent-card.json'
      - 'public/openapi.json'
      - 'test/agentApi.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-api-security.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/agentApi.js'
      - 'src/app/api/**'
      - 'scripts/extendAgentOpenApi.js'
      - 'scripts/validateAgentArtifacts.js'
      - 'public/.well-known/agent-card.json'
      - 'public/openapi.json'
      - 'test/agentApi.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-api-security.yml'

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Generate production dependency audit report
        run: npm audit --omit=dev --json --package-lock-only > npm-audit-production.json || true

      - name: Upload production dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-production
          path: npm-audit-production.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce production dependency audit
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('npm-audit-production.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Production audit counts:', counts);
          if ((counts.high || 0) > 0 || (counts.critical || 0) > 0) process.exit(1);
          EOF

      - name: Check JavaScript syntax
        run: |
          node --check src/lib/agentApi.js
          node --check src/app/api/resources/route.js
          node --check 'src/app/api/resources/[id]/route.js'
          node --check src/app/api/facets/route.js
          node --check src/app/api/health/route.js
          node --check scripts/extendAgentOpenApi.js
          node --check scripts/validateAgentArtifacts.js

      - name: Run security regression tests
        run: npm test

      - name: Regenerate and validate agent contracts
        run: |
          npm run update-openapi
          npm run extend-openapi
          npm run validate-agent-artifacts
