name: Verify release archive DOI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub release tag to verify
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release-with-doi.yml
      - scripts/verify_zenodo_release.py
      - scripts/test_verify_zenodo_release.py
      - .zenodo.json
      - CITATION.cff

permissions:
  contents: read

jobs:
  test-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p test_verify_zenodo_release.py

  verify-archive:
    if: github.event_name != 'pull_request'
    needs: test-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require a published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx false
      - name: Verify exact Zenodo version and repository
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/verify_zenodo_release.py "$RELEASE_TAG" --attempts 12 --interval 30
