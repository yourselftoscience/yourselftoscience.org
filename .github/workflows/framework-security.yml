name: Verify Cloudflare framework
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: python3 -m unittest discover -s scripts -p 'test_verify_zenodo_release.py'
      # Checked-in exports keep security builds independent of enrichment services.
      - run: npx next build
      - run: npx opennextjs-cloudflare build --skipNextBuild
      - name: Exercise the workerd bundle
        shell: bash
        run: |
          npx opennextjs-cloudflare preview --port 8787 > /tmp/y2s-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8787/data > /dev/null; then break; fi
            sleep 1
          done
          Y2S_TEST_URL=http://localhost:8787 npm test
      - run: git diff --check
