name: One-shot lockfile synchronization

on:
  push:
    branches:
      - feat/agent-ready-cloudflare
    paths:
      - '.github/workflows/one-shot-lockfile-sync.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feat/agent-ready-cloudflare

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate dependency classifications
        run: |
          npm audit --omit=dev --json --package-lock-only > npm-audit-runtime.json || true
          npm audit --json --package-lock-only > npm-audit-full.json || true
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const runtime = JSON.parse(readFileSync('npm-audit-runtime.json', 'utf8'));
          const full = JSON.parse(readFileSync('npm-audit-full.json', 'utf8'));
          console.log('Runtime audit:', runtime.metadata?.vulnerabilities || {});
          console.log('Full audit:', full.metadata?.vulnerabilities || {});
          EOF

      - name: Run regression checks
        run: |
          npm test
          npm run update-openapi
          npm run extend-openapi
          npm run validate-agent-artifacts

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audits-after-classification
          path: |
            npm-audit-runtime.json
            npm-audit-full.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit synchronized lockfile
        run: |
          git diff --check
          if git diff --quiet package-lock.json; then
            echo 'package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Synchronize lockfile dependency classifications'
          git push origin HEAD:feat/agent-ready-cloudflare
